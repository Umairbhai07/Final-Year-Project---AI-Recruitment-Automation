# One-command local run: Postgres + backend (mock AI, local file storage, console email).
#   docker compose up --build
# Then in another terminal: cd web && npm install && npm run dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruiter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/recruiter
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: [storage:/app/storage]

volumes:
  pgdata:
  storage:
